<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#14231D; --muted:#5B6B64; --line:#D3DCD7; --soft:#E3EBE6;
  --cane:#1F6F4A; --cane-ink:#FFFFFF; --cane-bg:#DCEFE4;
  --tag:#775000; --tag-bg:#FBEBC4; --alert:#A52E1B; --alert-bg:#F8DAD3; --idle-bg:#E3E8E5;
  --gauge:#1F6F4A;
  --idle-ink:#4C5F54; --stock-ink:#175D3E; --warning-gauge:#9A6700; --focus:#155B3B;
  --info-bg:#E6EEF8; --info-ink:#254F7C; --control-line:#7C8E83;
  color-scheme:light;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16211D; --ink:#E7F0EB; --muted:#93A59C; --line:#26342E; --soft:#1D2B25;
    --cane:#3DAA78; --cane-ink:#08130E; --cane-bg:#183A2B;
    --tag:#F0B429; --tag-bg:#3A2E0F; --alert:#FF9B88; --alert-bg:#3B1B15; --idle-bg:#222D28; --gauge:#3DAA78;
    --idle-ink:#A6B7AD; --stock-ink:#80D7A6; --warning-gauge:#E8B64D; --focus:#80D7A6;
    --info-bg:#1A293B; --info-ink:#AACAF5; --control-line:#6C8877;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --ink:#E7F0EB; --muted:#93A59C; --line:#26342E; --soft:#1D2B25;
  --cane:#3DAA78; --cane-ink:#08130E; --cane-bg:#183A2B;
  --tag:#F0B429; --tag-bg:#3A2E0F; --alert:#FF9B88; --alert-bg:#3B1B15; --idle-bg:#222D28; --gauge:#3DAA78;
    --idle-ink:#A6B7AD; --stock-ink:#80D7A6; --warning-gauge:#E8B64D; --focus:#80D7A6;
    --info-bg:#1A293B; --info-ink:#AACAF5; --control-line:#6C8877;
    color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,.big{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:baseline;
  justify-content:space-between;padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.top .unit{font-size:12px;color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:14px 16px}

/* on-hand hero */
.hero{background:var(--cane);color:var(--cane-ink);border-radius:14px;padding:16px 16px 14px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:64px;font-weight:700;line-height:1;margin:2px 0 10px}
.hero .big small{font-size:18px;font-weight:500;margin-left:6px;opacity:.85}
.hero .gauge{background:rgba(255,255,255,.25)}
.hero .gauge i{background:var(--cane-ink)}
.hero .pair{display:flex;gap:24px;margin-top:10px}
.hero .pair div span{display:block;font-size:12px;opacity:.85}
.hero .pair div b{font-family:var(--display);font-size:24px;font-weight:600}

/* gauge: reads like a tank level, ticks at quarters */
.gauge{position:relative;height:12px;border-radius:3px;background:var(--soft);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--gauge);border-radius:3px 0 0 3px}
.gauge::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent calc(25% - 1px),rgba(0,0,0,.28) calc(25% - 1px) 25%,transparent 25% calc(50% - 1px),rgba(0,0,0,.28) calc(50% - 1px) 50%,transparent 50% calc(75% - 1px),rgba(0,0,0,.28) calc(75% - 1px) 75%,transparent 75%)}
.gauge.low i{background:var(--warning-gauge)}
.gauge.over i{background:var(--alert)}

.alert{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--alert-bg);color:var(--alert);font-weight:500;font-size:14px}

.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}
.sec h2{margin:0;font-family:var(--display);font-size:20px;font-weight:600}
.sec .hint{font-size:12px;color:var(--muted)}

.typeRow{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.typeRow:last-child{border-bottom:0}
.typeRow .gauge{grid-column:1/-1;height:6px}
.typeRow b.num{font-size:19px;font-weight:600}
.typeRow .k{font-size:11px;color:var(--muted);display:block;text-align:right}

.search{display:flex;gap:8px;margin-top:8px}
.search input{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-b{flex:none;min-height:44px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip-b[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* list cards */
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px}
button.card:active{background:var(--soft)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sro-no{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.sub{color:var(--muted);font-size:13px;margin:2px 0 10px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.nums span{display:block;font-size:11px;color:var(--muted)}
.nums b{font-family:var(--display);font-size:22px;font-weight:600}
.nums .bal b{font-weight:700}
.pct{font-size:12px;color:var(--muted);margin-top:4px;text-align:right}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--cane-bg);color:var(--stock-ink)}
.chip.low{background:var(--tag-bg);color:var(--tag)}
.chip.empty{background:var(--idle-bg);color:var(--idle-ink);padding:2px 9px;border:0;border-radius:999px}
.chip.over{background:var(--alert-bg);color:var(--alert)}

.kv{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--muted);margin-top:4px}
.kv b{color:var(--ink);font-weight:500}
.lines{margin-top:8px;border-top:1px dashed var(--line)}
.line{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}
.line:last-child{border-bottom:0}
.line b{font-family:var(--display);font-size:18px;font-weight:600}
.tot{display:flex;justify-content:space-between;padding-top:8px;font-weight:600}

.btn{min-height:46px;height:auto;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:10px 18px;font-weight:600;font-size:15px}
.btn.primary{background:var(--cane);color:var(--cane-ink);border-color:var(--cane)}
.btn.danger{color:var(--alert);border-color:var(--alert);background:transparent}
.btn.block{display:block;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

.empty{text-align:center;padding:34px 18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:22px;margin-bottom:4px}
.empty .btns{justify-content:center;flex-wrap:wrap}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11.5px;color:var(--muted)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--stock-ink);font-weight:600;background:var(--cane-bg)}

/* sheet + dialog */
.scrim{position:fixed;inset:0;background:rgba(6,14,10,.55);z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:none;max-width:640px;margin:0 auto}
.sheet.on{display:block}
@media (prefers-reduced-motion:no-preference){.sheet.on{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
.sheet h3{margin:0;font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.x{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
label.f{display:block;margin:12px 0 0;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select{display:block;width:100%;height:46px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  padding:0 12px;font-size:16px;color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.info{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--info-bg);color:var(--info-ink);font-size:14px}
.info.bad{background:var(--alert-bg);color:var(--alert)}
.batch{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,110px) 44px;gap:8px;margin-top:8px;align-items:center}
.batch input{height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;font-size:16px;width:100%;color:var(--ink)}
.batch button{height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:18px}
.err{color:var(--alert);font-size:13px;margin-top:8px;min-height:1em}
table.led{width:100%;border-collapse:collapse;font-size:14px}
table.led th{font-size:11px;font-weight:500;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.led td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.led td.r,table.led th.r{text-align:right}
table.led td b{font-family:var(--display);font-size:17px;font-weight:600}
table.led tr[data-act]{cursor:pointer}
table.led small{display:block;color:var(--muted);font-size:12px}
.tabwrap{overflow-x:auto}
.dlg{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:420px;margin:0 auto;z-index:30;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:18px;display:none}
.dlg.on{display:block}
.dlg p{margin:0 0 4px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);
  border-radius:8px;padding:10px 14px;font-size:14px;display:none;text-align:center}
.toast.on{display:block}
.setting{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px 14px;margin-bottom:10px}
.setting p{color:var(--muted);font-size:13px;margin:4px 0 0}
.stack{display:grid;gap:10px;margin-top:10px}

.typeCard{background:var(--cane-bg);border:1px solid var(--cane);border-left-width:6px;border-radius:10px;padding:12px 14px;margin:0 0 10px}
.typeCard .tname{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.typeCard .tbal{text-align:right}
.typeCard .tbal b{display:block;font-size:36px;font-weight:700;line-height:1;color:var(--cane)}
.typeCard .tbal span{font-size:11px;color:var(--muted)}
.typeCard .gauge{margin-top:8px;background:var(--surface)}
.typeCard .nums b{font-size:20px}

.grp{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 0 8px;padding:6px 10px;border-left:6px solid var(--cane);background:var(--cane-bg);border-radius:0 8px 8px 0}
.grp .gname{font-family:var(--display);font-size:21px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.grp .gmeta{font-size:12px;color:var(--muted);text-align:right;flex:none}

.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:2px 0 8px}
.tcards::-webkit-scrollbar{display:none}
.tc{min-width:0;background:var(--cane-bg);border:1px solid var(--cane);border-left-width:5px;border-radius:10px;padding:8px 12px;display:grid;gap:0;text-align:left;color:var(--ink);cursor:pointer}
.tc.on{background:var(--cane);color:var(--cane-ink)}
.tc.on .num,.tc.on small{color:var(--cane-ink)}
.tc.all{background:var(--surface);border-color:var(--line);border-left-width:1px;align-content:center}
#rList{scroll-margin-top:72px}
.tc b{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.tc .num{font-size:25px;font-weight:700;color:var(--cane);line-height:1.15}
.tc small{color:var(--muted);font-size:12px}
.reg{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.rh,.rr,.rs{display:grid;grid-template-columns:minmax(0,1fr) 70px 104px;gap:8px;align-items:center;padding:9px 12px}
.rh{background:var(--soft);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rh span:nth-child(2),.rr .b{text-align:center}
.rh span:last-child,.rr .c,.rs span:last-child{text-align:right}
.rr{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.rr:nth-child(even){background:var(--bg)}
.rr:active{background:var(--soft)}
.rr .a b{display:block;font-family:var(--display);font-size:17px;font-weight:700;white-space:nowrap}
.rr .a small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .a small.bad{color:var(--alert);font-weight:600}
.rr .b{font-size:12px;color:var(--muted)}
.rr .c{font-size:18px;font-weight:600}
.rs{grid-template-columns:1fr auto;background:var(--cane-bg);border-top:1px solid var(--line);font-weight:600;font-size:14px}
.rs .num{font-size:20px;color:var(--stock-ink)}

[hidden]{display:none!important}
main{max-width:1000px}
.overview-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
h2{font-family:var(--display);font-size:24px;margin:0 0 6px}
.overview-heading .btns{flex-wrap:wrap;margin-top:0}
.overview-heading .btn{white-space:nowrap;flex:none}
.overview-heading p{color:var(--muted);margin:0 0 14px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:22px 0 30px;padding:20px 0;border-block:1px solid var(--line)}
.metrics dt{color:var(--muted);font-size:13px}
.metrics dd{font-family:var(--display);font-size:32px;font-variant-numeric:tabular-nums;margin:4px 0 0;overflow-wrap:anywhere}
.overview-columns{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.attention-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.attention-row small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.attention-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.activity-list{list-style:none;padding:0}
.activity-list li{display:flex;justify-content:space-between;gap:24px;padding:14px 0;border-bottom:1px solid var(--line)}
.activity-list time{color:var(--muted);font-size:12px;flex-shrink:0}
.filter-panel{display:grid;grid-template-columns:minmax(0,1fr);gap:12px 20px;margin:18px 0 22px;padding:18px 0;border-block:1px solid var(--line)}
.filter-panel .wide{grid-column:1/-1}
.filter-panel .f{margin:0}
.table-scroll{overflow-x:auto;margin-top:20px}
.table-scroll table{min-width:580px;width:100%}
caption{text-align:left;font-size:13px;color:var(--muted);padding:8px 0}
textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
nav#nav{grid-template-columns:repeat(7,minmax(0,1fr));overflow-x:auto;justify-content:space-around}
nav#nav button{min-width:62px;flex:1}
::selection{background:var(--cane-bg);color:var(--ink)}
input,textarea{caret-color:var(--cane)}
button:disabled{cursor:not-allowed;opacity:.5}
@media(min-width:480px){.filter-panel,.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:760px){nav#nav{max-width:1000px;left:50%;right:auto;width:100%;transform:translateX(-50%)}}
@media(max-width:600px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.overview-columns{grid-template-columns:1fr;gap:12px}.activity-list li{display:block}.activity-list time{display:block;margin-top:5px}nav#nav button{min-width:0;padding-inline:4px}nav#nav button span{font-size:10px}.top .unit{max-width:45%;text-align:right}}
.public-view nav#nav{grid-template-columns:repeat(4,minmax(0,1fr))}

.nav-brand{display:none}
.connection-bar{display:flex;gap:12px;align-items:center;padding:12px 20px;flex-wrap:wrap}
.type-grid,.delivery-grid{min-width:0}
@media(hover:hover){
 nav#nav button:hover:not([aria-current="page"]){background:var(--soft);color:var(--ink)}
 button.card:hover,.ledger-edit:hover,.chip-b:hover:not([aria-pressed="true"]),.attention-row[data-act]:hover{background:var(--soft)}
 .btn:hover:not(:disabled){filter:brightness(.96)}
}
@media(min-width:1024px){
 body.workspace{padding-left:228px;padding-bottom:0}
 .workspace .top{padding:25px 36px 20px;align-items:center;min-height:82px}
 .workspace .top h1{font-size:34px}
 .workspace .top .unit{font-size:14px}
 .workspace .connection-bar{max-width:1320px;margin:0 auto;padding:16px 36px;justify-content:flex-end;border-bottom:1px solid var(--line)}
 .workspace #cloudStatus{margin-right:auto;font-size:13px}
 .workspace main{max-width:1320px;padding:28px 36px 48px}
 .workspace nav#nav,.workspace.public-view nav#nav{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;left:0;right:auto;top:0;bottom:0;width:228px;max-width:none;transform:none;border-top:0;border-right:1px solid var(--line);padding:28px 16px;overflow-y:auto}
 .nav-brand{display:block;font-family:var(--display);font-size:28px;line-height:1.1;font-weight:700;padding:0 12px 28px}
 .nav-brand img{display:block;margin-bottom:14px}
 .nav-brand small{display:block;font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted);margin-top:10px;line-height:1.5}
 .workspace nav#nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;text-align:left;min-height:48px;height:auto;padding:12px;border-radius:8px;font-size:15px}
 .workspace nav#nav button[aria-current="page"]{background:var(--cane-bg)}
 .workspace nav#nav button span{font-size:15px}
 .workspace nav#nav button svg{width:21px;height:21px;flex-shrink:0}
 .workspace main[data-view="stock"] .type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
 .workspace .type-grid .typeCard{margin:0}
 .workspace #sroList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
 .workspace #sroList>.grp,.workspace #sroList>.empty{grid-column:1/-1}
 .workspace .delivery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px;align-items:start}
 .workspace .card{min-width:0;overflow-wrap:anywhere}
 .workspace .filter-panel{grid-template-columns:repeat(4,minmax(0,1fr));align-items:end}
 .workspace .filter-panel .wide{grid-column:auto}
 .workspace .filter-panel label:has(#deliveryQuery){grid-column:span 2}
 .workspace .filter-panel .btn{justify-self:start}
 .workspace main>.btn.primary.block{width:auto;min-width:180px}
 .workspace main[data-view="clients"]>label{max-width:480px}
 .workspace main[data-view="more"]{max-width:1000px}
 .workspace .sheet{left:auto;right:0;top:0;bottom:0;width:min(620px,calc(100vw - 260px));max-width:none;max-height:100%;margin:0;border-radius:0;padding:28px 32px 36px;border-left:1px solid var(--line)}
 .workspace .sheet.on{animation:none}
 .workspace .table-scroll table{font-size:15px}
 .workspace table.led th{font-size:12px;padding:12px 10px}
 .workspace table.led td{padding:14px 10px}
 .workspace .metrics{gap:28px;padding:24px 0}
 .workspace .metrics dd{font-size:42px}
}
@media(min-width:1600px){
 body.workspace{padding-left:248px}
 .workspace nav#nav,.workspace.public-view nav#nav{width:248px;padding:32px 22px}
 .workspace .overview-columns{gap:56px}
}

.ledger-edit{min-height:44px;min-width:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--stock-ink);font-weight:600;padding:8px 12px;white-space:nowrap}
.sheet .head h3{overflow-wrap:anywhere}
.sheet .head>div{min-width:0}
.sheet .head .x{flex-shrink:0}
label.f input,label.f select,.search input,.batch input,textarea{border-color:var(--control-line)}
input,textarea{caret-color:var(--focus)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--alert)}
.public-view #cloudStatus{color:var(--info-ink)}
/* Reflow and touch affordances apply to staff and public workspaces. */
label.f,input,select,textarea,.filter-panel>*{min-width:0;max-width:100%}
label.f input[type="date"]{width:100%;min-width:0}
.card,.typeCard,.attention-row>span{min-width:0;overflow-wrap:anywhere}
.row>:first-child,.nums>div,.line>span{min-width:0;overflow-wrap:anywhere}
.nums b,.metrics dd{overflow-wrap:anywhere}
.line,.rr{min-height:44px}
.sec{gap:10px;flex-wrap:wrap}
.dlg{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overflow-wrap:anywhere;overscroll-behavior:contain}
.sheet{overscroll-behavior:contain}
.sheet .head{gap:12px}
@media(max-width:479px){
 .typeCard .row{flex-wrap:wrap;align-items:flex-start}
 .typeCard .tbal{margin-left:auto}
 .table-scroll table{min-width:580px}
 .table-scroll,.tabwrap{max-width:100%;overscroll-behavior-x:contain}
 .sheet .btns .btn{flex-basis:100%}
}
.account-logo{display:block;margin:0 0 20px}
</style>
</head>
<body>
<header class="top"><h1 id="title">Stock</h1><span class="unit" id="unitLbl"></span></header>
<section id="account" role="main" aria-labelledby="accountTitle" tabindex="-1" class="setting" style="max-width:420px;margin:40px auto">
<img class="account-logo" src="/app-icon.svg" width="64" height="64" alt="">
<h2 id="accountTitle">Sign in to Sugar Inventory</h2><p id="accountMessage" role="status">Connecting to Supabase…</p>
<form id="loginForm"><label class="f">Email<input id="email" type="email" autocomplete="username" required></label><label class="f">Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary block" id="loginButton">Sign in</button></form>
<p id="signupNote" class="hint" hidden>Confirm your email after signing up. An administrator must approve access before you can edit the shared inventory.</p>
<button id="switchAuth" class="btn block" type="button" style="margin-top:12px">Create an account</button>
</section>
<div class="connection-bar"><span id="cloudStatus" role="status">Sign in to continue</span><button class="btn" id="reloadCloud" type="button">Refresh</button><button class="btn" id="signOut" type="button">Sign out</button></div>
<main id="main" hidden tabindex="-1"></main>
<nav id="nav" hidden aria-label="Sections"></nav>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></div>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogDescription" tabindex="-1"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" hidden>

<script type="module" src="/app.js"></script>
</body>
</html>
